[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense-agent"
version = "0.1.0"
description = "ShopSense M1-M8 customer-care agent with grounded RAG, workflow approvals, reliability hardening, and evaluation"
requires-python = ">=3.11"
dependencies = [
    "litellm==1.93.0; python_version < '3.12'",
    "litellm==1.102.1; python_version >= '3.12'",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "langchain-core>=1.6,<2",
    "langchain-litellm>=0.9,<1",
    "supermemory==3.55.0",
    "tiktoken==0.13.0",
    "qdrant-client==1.18.0",
    "langchain-google-genai==4.0.0",
    "langchain-community>=0.3,<1",
    "langchain-text-splitters>=0.3,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pypdf>=5,<7",
    "rank-bm25>=0.2,<1",
    "sentence-transformers>=5,<6",
    "fastmcp>=3.4,<4",
    "mcp>=1.28,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langfuse>=4,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
